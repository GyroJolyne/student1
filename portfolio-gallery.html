<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>刘宏亮 · 图像作品集</title>
<style>
:root{--ink:#101a18;--pink:#78f3ca;--paper:#f4efdc;--line:#2a3934}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);font-family:"Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--pink);text-decoration:none}
:focus-visible{outline:2px solid var(--pink);outline-offset:4px}
.gallery-brand{max-width:1650px;margin:auto;padding:22px 5vw 0}
.gallery-return{max-width:1650px;margin:auto;padding:0 5vw 32px;text-align:right}
.work-gallery{max-width:1650px;margin:auto;padding:58px 5vw 35px;scroll-margin-top:15px}
.work-gallery h2{font-size:clamp(30px,4vw,58px);margin:0 0 24px;letter-spacing:-.03em}
.spotlight{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:repeat(3,clamp(92px,11vw,172px));gap:13px}
.spot,.collection{position:relative;display:block;width:100%;overflow:hidden;padding:0;border:1px solid #38514a;border-radius:6px;background:#1b2522;text-align:left;isolation:isolate}
.spot-main{grid-row:span 3}
.spot img,.collection img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .32s ease}
.spot-main{background:linear-gradient(135deg,#103463,#176bc5 72%);background-size:100% 100%}
.spot-main img{width:58%;margin-left:auto}
.spot:not(.spot-main) img{object-position:center 38%}
.spot::after,.collection::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#090e0df5,transparent 68%);pointer-events:none}
.spot-main::after{background:linear-gradient(90deg,#102e57 4%,#123e73 33%,transparent 65%),linear-gradient(0deg,#081424c9,transparent 52%)}
.spot:not(.spot-main)::after{background:linear-gradient(90deg,#080e0ded,transparent 82%),linear-gradient(0deg,#080e0d70,transparent 70%)}
.spot-caption{position:absolute;z-index:1;left:clamp(12px,2vw,30px);right:14px;bottom:clamp(12px,2vw,28px);display:grid;gap:5px}
.spot-caption strong{font-size:clamp(17px,2vw,29px);line-height:1.2}
.spot-main .spot-caption strong{font-size:clamp(26px,3.4vw,52px)}
.spot-caption small{font-size:12px;color:#c9eadf}
.spot:hover,.collection:hover{border-color:var(--pink)}
.spot:hover img,.collection:hover img{transform:scale(1.04)}
.gallery-heading{margin:68px 0 20px;display:flex;align-items:baseline;gap:14px}
.gallery-heading h2{margin:0}.gallery-heading>span{color:#b8cbc5}
.collection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.collection{aspect-ratio:1.76}
.collection img{object-position:center 40%}
.portfolio-modal{width:min(96vw,1320px);height:min(91dvh,1060px);max-width:none;max-height:none;margin:auto;padding:0;border:1px solid #405852;border-radius:6px;background:#101a18;color:var(--paper);overflow:hidden}
.portfolio-modal[open]{display:grid;grid-template-rows:minmax(0,1fr) auto}
.portfolio-modal::backdrop,.image-viewer::backdrop{background:#060a09bf}
html:has(.portfolio-modal[open],.image-viewer[open]){overflow:hidden}
.portfolio-modal-content{overflow:auto;overscroll-behavior:contain}
.collection-content{padding:clamp(16px,3vw,36px)}
.portfolio-modal-actions{display:flex;justify-content:flex-end;margin:0;padding:10px clamp(16px,3vw,36px);border-top:1px solid #405852;background:#14211d}
.portfolio-modal-actions button,.collection-back{display:inline-block;padding:9px 13px;border:1px solid #405852;background:#1b2925;color:var(--pink)}
.portfolio-modal-actions button:hover,.collection-back:hover{border-color:var(--pink)}
.collection-panel h4{margin:20px 0 12px;font-size:15px;color:#b8cbc5}
.collection-images,.collection-row{display:grid;gap:12px}
.collection-lead{margin-bottom:12px}
.collection-row button{min-width:0;background:#101817;border:0;border-radius:4px;padding:0;overflow:hidden}
.collection-row img{width:100%;height:100%;object-fit:cover;display:block}
.image-viewer{background:#101a18;color:var(--paper);border:1px solid #405852;padding:16px;max-width:min(97vw,1320px);width:100%;max-height:96dvh}
.image-viewer header,.image-viewer footer{display:flex;justify-content:space-between;align-items:center;gap:10px}
.image-viewer header p{margin:0 0 8px}
.image-viewer footer{flex-wrap:wrap;margin-top:8px}
.image-viewer footer form{margin-inline-start:auto}
.image-viewer button{background:#24342e;padding:8px 12px;border:1px solid #405852}
.viewer-stage img{display:block;margin:auto;max-width:100%;height:min(76dvh,calc(96dvh - 130px));object-fit:contain}
@media(max-width:700px){
  .work-gallery{padding-inline:6vw}
  .spotlight{grid-template-columns:1fr;grid-template-rows:auto repeat(3,110px)}
  .spot-main{grid-row:auto;aspect-ratio:1.45}
  .collection-images,.collection-row{gap:6px}
  .collection-lead{margin-bottom:6px}
  .collection{aspect-ratio:1.34}
  .spot-caption strong{font-size:16px}
  .gallery-heading{margin-top:46px}
}
@media(prefers-reduced-motion:reduce){.spot img,.collection img{transition:none}}
</style>

</section></main>

;
const viewer = document.querySelector('.image-viewer');
const panel = document.querySelector('.collection-panel');
const collectionButtons = document.querySelectorAll('.collection');
const entriesById = new Map(galleryData.entries.map(entry => [entry.id,entry]));
let sequence = galleryData.entries;
let index = 0;

function showImage() {
  const {source,caption} = sequence[index];
  const image = viewer.querySelector('img');
  image.src = source;
  image.alt = caption;
  viewer.querySelector('#viewer-title').textContent = caption;
  viewer.querySelector('.viewer-count').textContent = (index + 1) + ' / ' + sequence.length;
}
function openImage(id, list) {
  sequence = list;
  index = sequence.findIndex(entry => entry.id === id);
  showImage();
  viewer.showModal();
}
function step(amount) {
  index = (index + amount + sequence.length) % sequence.length;
  showImage();
}
document.querySelectorAll('.spot').forEach(button => button.addEventListener('click', () => {
  const entry = entriesById.get(Number(button.dataset.image));
  openImage(entry.id,galleryData.entries.filter(item => item.category === entry.category));
}));

function arrangeRows(grid) {
  const width = grid.clientWidth;
  if (!width) return;
  const gap = parseFloat(getComputedStyle(grid).columnGap);
  const targetHeight = Math.min(392, Math.max(160, width * .34));
  const tiles = [...grid.querySelectorAll('button')];
  const ratios = tiles.map(tile => tile.firstElementChild.width / tile.firstElementChild.height);
  const cost = Array(tiles.length + 1).fill(Infinity);
  const lengths = [];
  cost[tiles.length] = 0;

  for (let start = tiles.length - 1; start >= 0; start--) {
    let ratioSum = 0;
    for (let end = start; end < Math.min(start + 6, tiles.length); end++) {
      ratioSum += ratios[end];
      const count = end - start + 1;
      const height = (width - gap * (count - 1)) / ratioSum;
      const singletonPenalty = count === 1 && tiles.length > 1 ? .55 : 0;
      const total = Math.log(height / targetHeight) ** 2 + singletonPenalty + cost[end + 1];
      if (total < cost[start]) {
        cost[start] = total;
        lengths[start] = count;
      }
    }
  }

  const rows = [];
  for (let start = 0; start < tiles.length; start += lengths[start]) {
    rows.push({start, end:start + lengths[start]});
  }
  const visibleRows = [...grid.children];
  if (visibleRows.every(row => row.classList.contains('collection-row')) &&
      visibleRows.length === rows.length &&
      rows.every(({start,end}, i) => visibleRows[i].childElementCount === end - start)) return;

  const focused = grid.contains(document.activeElement) ? document.activeElement : null;
  const fragment = document.createDocumentFragment();
  for (const {start,end} of rows) {
    const row = document.createElement('div');
    row.className = 'collection-row';
    row.style.gridTemplateColumns = ratios.slice(start,end).map(ratio => `minmax(0,${ratio}fr)`).join(' ');
    row.append(...tiles.slice(start,end));
    fragment.append(row);
  }
  grid.replaceChildren(fragment);
  focused?.focus({preventScroll:true});
}
const collectionResize = new ResizeObserver(() => {
  panel.querySelectorAll('.collection-images').forEach(arrangeRows);
});
collectionResize.observe(panel);

const collectionTitle = panel.querySelector('#collection-title');
const collectionContent = panel.querySelector('.collection-content');
const collectionItems = panel.querySelector('.collection-items');
let openedCollection;

panel.addEventListener('close', () => {
  openedCollection?.focus({preventScroll:true});
});

collectionButtons.forEach(button => button.addEventListener('click', () => {
  if (panel.open) return;
  const group = galleryData.groups[button.dataset.group];
  openedCollection = button;
  collectionTitle.textContent = group.name;
  collectionItems.replaceChildren();
  const entries = galleryData.entries.filter(item => group.groups.includes(item.category));
  const lead = entries.find(item => item.id === group.lead);
  const list = lead ? [lead,...entries.filter(item => item !== lead)] : entries;
  group.groups.forEach(category => {
    if (group.groups.length > 1) {
      const heading = document.createElement('h4');
      heading.textContent = galleryData.categoryNames[category];
      collectionItems.append(heading);
    }
    const grid = document.createElement('div');
    grid.className = 'collection-images';
    for (const entry of list.filter(item => item.category === category)) {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.setAttribute('aria-label','查看' + entry.caption + '大图');
      const image = new Image();
      image.alt = '';
      image.src = entry.source;
      image.width = entry.width;
      image.height = entry.height;
      image.loading = 'lazy';
      tile.append(image);
      tile.addEventListener('click', () => openImage(entry.id,list));
      if (entry === lead) {
        const leadRow = document.createElement('div');
        leadRow.className = 'collection-row collection-lead';
        leadRow.append(tile);
        collectionItems.append(leadRow);
      } else {
        grid.append(tile);
      }
    }
    collectionItems.append(grid);
  });
  panel.showModal();
  collectionContent.scrollTop = 0;
  collectionItems.querySelectorAll('.collection-images').forEach(arrangeRows);
}));
viewer.querySelector('.previous').addEventListener('click', () => step(-1));
viewer.querySelector('.next').addEventListener('click', () => step(1));
viewer.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') step(-1);
  if (event.key === 'ArrowRight') step(1);
});
</script>
